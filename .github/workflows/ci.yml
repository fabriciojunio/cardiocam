name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # A suíte inteira, com os testes de vídeo e a meta de cobertura, roda
          # numa versão só. Nas outras o objetivo é diferente: confirmar que o
          # código funciona na versão da linguagem, e para isso o subconjunto
          # rápido basta. Rodar tudo em quatro versões custava perto de uma hora
          # de máquina por commit para responder quatro vezes a mesma pergunta.
          - python: "3.12"
            completo: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependências do sistema
        # O opencv-python precisa de libgl e libglib mesmo sem interface
        # gráfica, porque o pacote traz o módulo highgui compilado. As quatro
        # seguintes são do Qt: mesmo com a plataforma `offscreen`, que desenha
        # num mapa de bits, o PySide6 carrega as bibliotecas de EGL e de teclado
        # ao iniciar e falha sem elas.
        #
        # A remoção das listas de terceiros antes do update não é zelo
        # desnecessário: em 05/10/2026 o build quebrou porque
        # packages.microsoft.com devolveu 403 ao `apt-get update`, e o passo
        # inteiro falhou por causa de um repositório que este projeto não usa.
        # CI que reprova por motivo alheio ao código é CI em que se para de
        # confiar, e o remédio certo é não depender do que não é necessário, e
        # não mascarar a falha com `|| true`.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list
          sudo rm -f /etc/apt/sources.list.d/*azure*.list
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Instalar o projeto
        run: pip install -e ".[dev]"

      - name: Rodar a suíte completa com cobertura
        if: matrix.completo
        run: pytest -n auto --cov=cardiocam --cov-report=term-missing

      - name: Rodar o subconjunto rápido
        if: ${{ !matrix.completo }}
        run: pytest -n auto -m "not lento" -p no:cacheprovider

  documentacao:
    # A documentação de iniciação científica vai para comitê de ética, e erro
    # de acentuação ou link quebrado custa credibilidade justamente onde ela
    # importa.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar os documentos de iniciação científica
        run: python docs/iniciacao-cientifica/validar_documentos.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verificar dependências e regressões no Windows
        run: |
          pip check
          pytest -n auto -m "not lento" -p no:cacheprovider

  dependencias-minimas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Instalar versões mínimas declaradas
        run: pip install -e ".[dev]" numpy==1.26.0 scipy==1.11.0 opencv-python==4.8.0.74 scikit-learn==1.3.0 PySide6-Essentials==6.7.0 mss==9.0.0
      - run: pip check
      - name: Verificar o contrato das dependências
        run: pytest -n auto -m "not lento" -p no:cacheprovider

  demonstracao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list
          sudo rm -f /etc/apt/sources.list.d/*azure*.list
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - run: pip install -e .

      - name: Medir um pulso simulado de frequência conhecida
        # Prova de fumaça de ponta a ponta: se o erro contra o valor verdadeiro
        # crescer, o build quebra.
        run: cardiocam simular --bpm 84 --duracao 20 --algoritmo pos

      - name: Comparar os algoritmos
        run: cardiocam avaliar
