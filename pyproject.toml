[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiocam"
version = "1.0.0"
description = "Medição de frequência cardíaca sem contato a partir de vídeo (rPPG)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Junio Andrade" }]
keywords = ["rppg", "fotopletismografia", "processamento-de-sinais", "visao-computacional"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "opencv-python>=4.8,<5",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "matplotlib>=3.7",
]

[project.scripts]
cardiocam = "cardiocam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "lento: testes que processam vídeo completo e demoram mais",
    "camera: exige webcam física, desativado por padrão",
]

[tool.coverage.run]
source = ["src/cardiocam"]
branch = true
omit = [
    # Fronteiras com hardware e com o sistema gráfico. Estes três módulos só
    # executam de verdade com câmera física, tela e servidor gráfico presentes,
    # nada disso existe na integração contínua, e cobri-los com simulacros
    # mediria o simulacro e não o código. Ficam de fora da meta em vez de
    # inflar o número com testes que não provam nada.
    "src/cardiocam/fontes/webcam.py",
    "src/cardiocam/fontes/tela.py",
    "src/cardiocam/ui/app.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: sem cobertura", "if TYPE_CHECKING:", "raise NotImplementedError"]
